name: Test

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Lint GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test release publication rules
        run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v
      - name: Check container smoke-test syntax
        run: bash -n scripts/smoke-container.sh

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "1"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang libclang-dev \
            libssl-dev libfontconfig-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create desktop sidecar placeholder for Tauri compile-time checks
        run: |
          # The desktop crate's Tauri build script requires the packaged sidecar path
          # to exist at compile time. For test/coverage CI we only need the file to
          # exist; we do not need to build the real worker binary here.
          target_triple="$(rustc -vV | awk '/^host: / { print $2 }')"
          sidecar_path="crates/desktop/sidecars/wilkes-rust-worker-${target_triple}"
          mkdir -p "$(dirname "$sidecar_path")"
          printf '#!/bin/sh\nexit 0\n' > "$sidecar_path"
          chmod +x "$sidecar_path"

      - name: Test with coverage
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Write Rust coverage reports
        run: |
          # Tauri copies the shell placeholder beside the instrumented binaries.
          # Remove only that copy: llvm-cov requires native object files, and the
          # worker's compiled test binary in debug/deps still supplies its coverage.
          target_triple="$(rustc -vV | awk '/^host: / { print $2 }')"
          cmp "crates/desktop/sidecars/wilkes-rust-worker-${target_triple}" \
            target/llvm-cov-target/debug/wilkes-rust-worker
          rm target/llvm-cov-target/debug/wilkes-rust-worker
          cargo llvm-cov report --json --summary-only --output-path rust-coverage.json
          cargo llvm-cov report --cobertura --output-path rust-cobertura.xml

      - name: Show sccache stats
        run: $SCCACHE_PATH --show-stats

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: |
            rust-coverage.json
            rust-cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ubuntu-node-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ubuntu-node-

      - name: Install dependencies
        run: npm ci --prefix ui

      - name: Test with coverage
        run: npm run test:coverage --prefix ui

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: ui/coverage

      - name: Build
        run: npm run build --prefix ui

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - rust
      - frontend
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build coverage comment
        run: |
          python3 scripts/pr_coverage_report.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --ui-summary "artifacts/ui-coverage-report/coverage-summary.json" \
            --ui-cobertura "artifacts/ui-coverage-report/cobertura-coverage.xml" \
            --rust-summary "artifacts/rust-coverage-report/rust-coverage.json" \
            --rust-cobertura "artifacts/rust-coverage-report/rust-cobertura.xml" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output coverage-comment.md

      - name: Write workflow summary
        run: cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("coverage-comment.md", "utf8");

            if (context.eventName !== "pull_request") {
              return;
            }

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes("<!-- wilkes-pr-coverage -->"),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
