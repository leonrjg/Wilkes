name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only Windows packages (skip validation, other platforms, and publication)
        type: boolean
        default: false

permissions:
  contents: read

# One release owner; never let two versions race to move stable aliases.
concurrency:
  group: wilkes-release${{ github.event_name == 'workflow_dispatch' && inputs.windows_only && '-windows-check' || '' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      signing: ${{ steps.metadata.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate release identity and signing policy
        id: metadata
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING }}
        run: >-
          python3 scripts/release_metadata.py
          --event "$RELEASE_EVENT" --ref "$RELEASE_REF"
          --signing "$RELEASE_SIGNING" --output "$GITHUB_OUTPUT"

  validate:
    if: ${{ !inputs.windows_only }}
    needs: prepare
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, validate]
    # A manual Windows check can proceed when validation was deliberately skipped.
    # Tag builds still require the complete validation suite.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.validate.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.windows_only && needs.validate.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.windows_only &&
              '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","extra_args":""}]' ||
              '[{"os":"macos-14","target":"aarch64-apple-darwin","extra_args":"--config tauri.macos.conf.json"},
                {"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","extra_args":""},
                {"os":"windows-latest","target":"x86_64-pc-windows-msvc","extra_args":""}]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install pinned Rust toolchain and build target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Cache ORT download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ort
            ~/Library/Caches/ort
            ~/AppData/Local/ort
          key: ${{ runner.os }}-ort-${{ hashFiles('Cargo.lock') }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang libclang-dev \
            libssl-dev libfontconfig-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Clean cached bundle outputs
        shell: bash
        run: rm -rf target/${{ matrix.target }}/release/bundle

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          SIGNING_MODE: ${{ needs.prepare.outputs.signing }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$SIGNING_MODE" == unsigned ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Signed releases require $name"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/wilkes-signing.p12"
          keychain="$RUNNER_TEMP/wilkes-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: crates/desktop
        env:
          APPLE_ID: ${{ needs.prepare.outputs.signing == 'signed' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.prepare.outputs.signing == 'signed' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare.outputs.signing == 'signed' && secrets.APPLE_TEAM_ID || '' }}
        run: ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} ${{ matrix.extra_args }} -- --locked

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && needs.prepare.outputs.signing == 'signed'
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Wilkes.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS' && needs.prepare.outputs.signing == 'signed'
        run: |
          keychain="$RUNNER_TEMP/wilkes-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: crates/desktop
        run: ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} -- --locked

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: crates/desktop
        env:
          SIGNING_MODE: ${{ needs.prepare.outputs.signing }}
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          CFLAGS: /MD
          CXXFLAGS: /MD
        run: |
          $releaseDir = "../../target/${{ matrix.target }}/release"
          $bundleDir = Join-Path $releaseDir "bundle"
          foreach ($dir in @("nsis", "msi")) {
            $path = Join-Path $bundleDir $dir
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          if ($env:SIGNING_MODE -eq "signed") {
            foreach ($name in @("CERTIFICATE_BASE64", "CERTIFICATE_PASSWORD", "THUMBPRINT")) {
              if (-not [Environment]::GetEnvironmentVariable($name)) {
                throw "Signed releases require $name"
              }
            }
            $bytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
            $pfxPath = Join-Path $env:TEMP certificate.pfx
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            try {
              Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
                -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
            } finally {
              Remove-Item $pfxPath -ErrorAction SilentlyContinue
            }
            $configJson = '{"bundle":{"windows":{"certificateThumbprint":"' + $env:THUMBPRINT + '","timestampUrl":"http://timestamp.digicert.com"}}}'
            ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --config $configJson -- --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Sign both loose executables too: these are shipped in the portable ZIP.
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found" }
            foreach ($binary in @("wilkes-desktop.exe", "wilkes-rust-worker.exe")) {
              & $signTool.FullName sign /sha1 $env:THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Join-Path $releaseDir $binary)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $signedFiles = @(
              (Join-Path $releaseDir "wilkes-desktop.exe"),
              (Join-Path $releaseDir "wilkes-rust-worker.exe")
            ) + @(Get-ChildItem $bundleDir -Recurse -File | Where-Object { $_.Extension -in @(".msi", ".exe") } | ForEach-Object FullName)
            foreach ($file in $signedFiles) {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
                throw "Invalid or unexpected signing certificate: $file"
              }
            }
          } else {
            ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} -- --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create portable Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          $bundleDir = Join-Path $releaseDir "bundle/portable"
          $portableRoot = Join-Path $bundleDir "Wilkes"
          $zipPath = Join-Path $bundleDir "Wilkes_${{ matrix.target }}_portable.zip"

          if (Test-Path $portableRoot) {
            Remove-Item $portableRoot -Recurse -Force
          }
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          New-Item -ItemType Directory -Path $portableRoot | Out-Null

          Copy-Item (Join-Path $releaseDir "wilkes-desktop.exe") (Join-Path $portableRoot "Wilkes.exe")
          Copy-Item (Join-Path $releaseDir "wilkes-rust-worker.exe") (Join-Path $portableRoot "wilkes-rust-worker.exe")
          Copy-Item "crates/worker/requirements.txt" (Join-Path $portableRoot "requirements.txt")
          Copy-Item "crates/worker/wilkes_python_worker" (Join-Path $portableRoot "wilkes_python_worker") -Recurse

          $webViewLoader = Join-Path $releaseDir "WebView2Loader.dll"
          if (Test-Path $webViewLoader) {
            Copy-Item $webViewLoader (Join-Path $portableRoot "WebView2Loader.dll")
          }

          Compress-Archive -Path (Join-Path $portableRoot "*") -DestinationPath $zipPath

      - name: Verify expected desktop bundles
        shell: bash
        run: python scripts/verify_release_bundles.py ${{ matrix.target }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wilkes-${{ matrix.target }}
          if-no-files-found: error
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wilkes-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wilkes-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/portable/*.zip

  docker:
    if: ${{ !inputs.windows_only }}
    needs: [prepare, validate, build]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, validate, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wilkes-*

      - name: Record artifact checksums
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          body: |
            Built and validated from commit `${{ needs.prepare.outputs.sha }}`.
            Desktop signing policy: **${{ needs.prepare.outputs.signing }}**.
            Supported desktop targets: Apple Silicon macOS, x86-64 Windows, and x86-64 Linux.
            Container platforms: linux/amd64 and linux/arm64.
          generate_release_notes: true
