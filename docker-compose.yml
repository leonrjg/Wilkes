services:
  wilkes:
    build: .
    container_name: wilkes
    environment:
      WILKES_HOST: "0.0.0.0"
      # Bound beyond loopback, the server answers only callers that present
      # this token; the web interface asks for it once.
      WILKES_API_TOKEN: "${WILKES_API_TOKEN:?set WILKES_API_TOKEN to a long random string}"
    ports:
      - "2000:2000"
    volumes:
      - wilkes-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wilkes-data:
