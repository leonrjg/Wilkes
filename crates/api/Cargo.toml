[package]
name = "wilkes-api"
version.workspace = true
edition = "2021"

[features]
# Forwarded rather than assumed. `context.rs` gates the layout-detector and
# formula-recognizer installs on this, and a crate that tests a feature it does
# not declare tests `false` for ever — which is precisely how those two
# downloads came to compile to their "not compiled in" stubs while the code
# they refuse to reach was sitting in the binary.
default = ["recognize-onnx"]
recognize-onnx = ["wilkes-core/recognize-onnx"]

[dependencies]
wilkes-core = { path = "../core" }
wilkes-agent = { path = "../agent" }
anyhow = "1"
tracing = "0.1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
cel-interpreter = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
wilkes-core = { path = "../core", features = ["test-utils"] }
