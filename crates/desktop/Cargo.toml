[package]
name = "wilkes-desktop"
version.workspace = true
edition = "2021"
default-run = "wilkes-desktop"

[lib]
name = "wilkes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wilkes-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# See the note in `crates/api/Cargo.toml`. This is the build the two model
# downloads are actually offered from, so this is the crate where the missing
# declaration was a defect rather than a tidiness problem.
default = ["recognize-onnx", "recognize-vision"]
recognize-onnx = ["wilkes-api/recognize-onnx", "wilkes-core/recognize-onnx"]
# Compiled into the shipped application, though not into `wilkes-core`'s own
# default: a library consumer should not be made to build an Objective-C shim,
# but the app that offers the engine picker has to contain the engine it
# offers. Keeping it out of the build was not the same decision as keeping it
# out of the default — the default engine is ONNX either way, and the picker
# greyed Vision out on the one platform that has it.
recognize-vision = ["wilkes-core/recognize-vision"]

[dependencies]
wilkes-api = { path = "../api" }
wilkes-agent = { path = "../agent" }
wilkes-core = { path = "../core" }
# For the HTTP API the app serves over its own workspace — the same router the
# standalone server mounts, so consumers see one API and not two.
wilkes-server = { path = "../server" }
# `macos-private-api` is what lets the browser pane open in the app's
# background colour on macOS rather than the webview's white.
tauri = { version = "2", features = ["protocol-asset", "devtools", "test", "unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
clipboard-files = "0.1.2"
trash = "5.2"
# Reads one site's cookies from the user's browser into the browser pane.
rookie = "0.5.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# The browser pane's own background, its find and the link under the
# pointer, which Tauri has no way to.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKFindConfiguration", "WKFindResult"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# The link under the pointer in the browser pane, which Tauri has no way to.
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
# The browser pane's find and the link under the pointer, which Tauri has no
# way to.
webkit2gtk = "2.0"
gtk = "0.18"

[dev-dependencies]
tempfile = "3.10"
