[package]
name = "wilkes-desktop"
version.workspace = true
edition = "2021"
default-run = "wilkes-desktop"

[lib]
name = "wilkes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wilkes-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# See the note in `crates/api/Cargo.toml`. This is the build the two model
# downloads are actually offered from, so this is the crate where the missing
# declaration was a defect rather than a tidiness problem.
default = ["recognize-onnx", "recognize-vision"]
recognize-onnx = ["wilkes-api/recognize-onnx", "wilkes-core/recognize-onnx"]
# Compiled into the shipped application, though not into `wilkes-core`'s own
# default: a library consumer should not be made to build an Objective-C shim,
# but the app that offers the engine picker has to contain the engine it
# offers. Keeping it out of the build was not the same decision as keeping it
# out of the default — the default engine is ONNX either way, and the picker
# greyed Vision out on the one platform that has it.
recognize-vision = ["wilkes-core/recognize-vision"]

[dependencies]
wilkes-api = { path = "../api" }
wilkes-agent = { path = "../agent" }
wilkes-core = { path = "../core" }
# For the HTTP API the app serves over its own workspace — the same router the
# standalone server mounts, so consumers see one API and not two.
wilkes-server = { path = "../server" }
tauri = { version = "2", features = ["protocol-asset", "devtools", "test"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
clipboard-files = "0.1.2"
trash = "5.2"

[dev-dependencies]
tempfile = "3.10"
