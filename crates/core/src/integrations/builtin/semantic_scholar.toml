# Semantic Scholar (https://www.semanticscholar.org): the Academic Graph API.
#
# Shipped with Wilkes as a manifest and loaded through the same engine as any
# manifest a user writes. Nothing about it is compiled in.

manifest_version = 2
id = "semantic_scholar"
name = "Semantic Scholar"

[http]
base_url = "https://api.semanticscholar.org"

# Unauthenticated requests share a public rate limit; a key raises it.
# Optional: the integration works without it.
[http.headers]
x-api-key = { secret = "api_key", optional = true, label = "API key", kind = "password" }

[capabilities.health]
path = "/graph/v1/paper/DOI:10.1145%2F3801158?fields=paperId"

[capabilities.search]
path = "/graph/v1/paper/search?query={query}&limit={limit}&offset={offset}&fields=title,citationCount,externalIds,year,venue,publicationDate,isOpenAccess,openAccessPdf,authors"
items = "data"

[capabilities.search.fields]
id = "paperId"
title = "title"
doi = "normalize_doi(externalIds.DOI)"
year = "year"
publication_date = "publicationDate"
venue = "venue"
citation_count = "citationCount"
is_open_access = "isOpenAccess"
pdf_url = "openAccessPdf.url"
open_access_status = "openAccessPdf.status"
license = "openAccessPdf.license"
authors = "join(', ', authors[:8].name || `[]`) || `null`"

# ── Browse: the search, narrowed by filter ───────────────────────────────────
#
# The listing is the relevance search, so it needs a keyword and has no sort:
# only the bulk endpoint sorts, and that one pages by token. Each filter is its
# own parameter, written where the path names it; one that is not set sends
# nothing. A year range is one parameter: `year=2016-2020`, `2016-`, `-2020`.

[capabilities.browse]
path = "/graph/v1/paper/search?query={query}&year={year_from}-{year_to}&publicationTypes={type}&fieldsOfStudy={field}&venue={venue}&minCitationCount={cited_at_least}&{open_access}&limit={limit}&offset={offset}&fields=title,citationCount,externalIds,year,venue,publicationDate,isOpenAccess,openAccessPdf,authors"
query_required = true
total = "to_int(total)"

# Several values of one filter are a comma-separated list, matching any.
[capabilities.browse.modes]
any = { label = "Any of", join = "," }

[capabilities.browse.filters]
year_from      = { equivalent_to = "year_from", label = "From", group = "Year", clause = "{value}", value = "integer" }
year_to        = { equivalent_to = "year_to", label = "To", group = "Year", clause = "{value}", value = "integer" }
type           = { equivalent_to = "type", equivalent_values = { JournalArticle = "article", Review = "review", Book = "book", BookSection = "book-chapter", Conference = "conference-paper", Dataset = "dataset", Editorial = "editorial", LettersAndComments = "letter" }, label = "Type", clause = "{value}", modes = ["any"], options = [
  ["JournalArticle", "Journal article"],
  ["Review", "Review"],
  ["Conference", "Conference paper"],
  ["Book", "Book"],
  ["BookSection", "Book section"],
  ["MetaAnalysis", "Meta-analysis"],
  ["ClinicalTrial", "Clinical trial"],
  ["CaseReport", "Case report"],
  ["Study", "Study"],
  ["Dataset", "Dataset"],
  ["Editorial", "Editorial"],
  ["LettersAndComments", "Letters and comments"],
  ["News", "News"],
] }
field          = { label = "Field of study", clause = "{value}", modes = ["any"], options = [
  ["Computer Science", "Computer Science"],
  ["Medicine", "Medicine"],
  ["Chemistry", "Chemistry"],
  ["Biology", "Biology"],
  ["Materials Science", "Materials Science"],
  ["Physics", "Physics"],
  ["Geology", "Geology"],
  ["Psychology", "Psychology"],
  ["Art", "Art"],
  ["History", "History"],
  ["Geography", "Geography"],
  ["Sociology", "Sociology"],
  ["Business", "Business"],
  ["Political Science", "Political Science"],
  ["Economics", "Economics"],
  ["Philosophy", "Philosophy"],
  ["Mathematics", "Mathematics"],
  ["Engineering", "Engineering"],
  ["Environmental Science", "Environmental Science"],
  ["Agricultural and Food Sciences", "Agricultural and Food Sciences"],
  ["Education", "Education"],
  ["Law", "Law"],
  ["Linguistics", "Linguistics"],
] }
venue          = { label = "Venue", clause = "{value}", value = "text" }
# "At least", where the shared citation filter is "more than": not the same.
cited_at_least = { label = "Cited at least", clause = "{value}", value = "integer" }
open_access    = { equivalent_to = "open_access", label = "With a public PDF", clause = "openAccessPdf" }

# ── Lookup: DOI in, one record out (metadata enrichment) ──────────────────────

[capabilities.lookup]
paths = [
  "/graph/v1/paper/DOI:{doi}?fields=title,citationCount,externalIds,year,venue,publicationDate,isOpenAccess,openAccessPdf",
]

[capabilities.lookup.fields]
id = "paperId"
title = "title"
year = "year"
publication_date = "publicationDate"
venue = "venue"
citation_count = "citationCount"
external_ids = "externalIds"
