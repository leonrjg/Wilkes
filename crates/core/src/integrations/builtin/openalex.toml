# OpenAlex (https://openalex.org): the open catalogue of scholarly works.
#
# Shipped with Wilkes as a manifest and loaded through the same engine as any
# manifest a user writes. Nothing about it is compiled in.

manifest_version = 2
id = "openalex"
name = "OpenAlex"

[http]
base_url = "https://api.openalex.org"

# OpenAlex answers anonymous requests from a shared pool and requests that
# identify a contact address from a faster one. Optional: the integration works
# without it.
[http.query]
mailto = { secret = "email", optional = true, label = "Email", kind = "email" }

[capabilities.health]
path = "/works?filter=doi:https://doi.org/10.1145/3801158&select=id&per-page=1"

# ── Search: keyword in, works out ─────────────────────────────────────────────

[capabilities.search]
path = "/works?search={query}&per-page={limit}&page={page}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location,best_oa_location,open_access,authorships"
items = "results"

[capabilities.search.fields]
id = "id"
title = "display_name"
doi = "normalize_doi(ids.doi)"
year = "publication_year"
publication_date = "publication_date"
venue = "primary_location.source.display_name"
citation_count = "cited_by_count"
# A work is open access when either the work or its best location says so.
is_open_access = "open_access.is_oa || best_oa_location.is_oa"
pdf_url = "best_oa_location.pdf_url"
landing_page_url = "not_null(best_oa_location.landing_page_url, open_access.oa_url)"
open_access_status = "open_access.oa_status"
license = "best_oa_location.license"
publisher = "primary_location.source.host_organization_name"
# The first few authors; an empty list is no authors, not an empty string.
authors = "join(', ', authorships[:8].author.display_name || `[]`) || `null`"

# ── Browse: the same works, listed by filter and sort ─────────────────────────

[capabilities.browse]
path = "/works?search={query}&filter={filters}&sort={sort}&per-page={limit}&page={page}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location,best_oa_location,open_access,authorships"
filter_separator = ","
total = "meta.count"

[capabilities.browse.sort]
equivalent_to = { "cited_by_count:desc" = "most_cited", "publication_date:desc" = "newest", "publication_date:asc" = "oldest", "relevance_score:desc" = "most_relevant" }
default = "cited_by_count:desc"
keyword_default = "relevance_score:desc"
options = [
  ["cited_by_count:desc", "Most cited"],
  ["publication_date:desc", "Newest first"],
  ["publication_date:asc", "Oldest first"],
  ["relevance_score:desc", "Most relevant (needs a keyword)"],
]

# Every autocomplete endpoint answers in this one shape.
[capabilities.browse.suggest]
items = "results"
value = "id"
label = "display_name"
hint = "hint"

# How OpenAlex writes several values of one attribute. "All of" and "None of"
# repeat the clause, which the filter separator ANDs.
[capabilities.browse.modes]
any  = { label = "Any of",  join = "|" }
all  = { label = "All of",  repeat = true }
none = { label = "None of", repeat = true, value = "!{value}" }

# One line per filter, in the order the pane offers them. A clause with no
# {value} is on or off; a range is two filters sharing a group.
[capabilities.browse.filters]
year_from      = { equivalent_to = "year_from", label = "From", group = "Year", clause = "from_publication_date:{value}-01-01", value = "integer" }
year_to        = { equivalent_to = "year_to", label = "To", group = "Year", clause = "to_publication_date:{value}-12-31", value = "integer" }
published_from = { equivalent_to = "published_from", label = "From", group = "Published", clause = "from_publication_date:{value}", value = "date" }
published_to   = { equivalent_to = "published_to", label = "To", group = "Published", clause = "to_publication_date:{value}", value = "date" }
type           = { equivalent_to = "type", label = "Type", clause = "type:{value}", modes = ["any", "none"], options = [
  ["article", "Article"],
  ["review", "Review"],
  ["preprint", "Preprint"],
  ["book", "Book"],
  ["book-chapter", "Book chapter"],
  ["dissertation", "Dissertation"],
  ["conference-paper", "Conference paper"],
  ["conference-abstract", "Conference abstract"],
  ["report", "Report"],
  ["dataset", "Dataset"],
  ["software", "Software"],
  ["editorial", "Editorial"],
  ["letter", "Letter"],
  ["book-review", "Book review"],
  ["peer-review", "Peer review"],
  ["reference-entry", "Reference entry"],
  ["standard", "Standard"],
  ["erratum", "Erratum"],
  ["retraction", "Retraction notice"],
  ["other", "Other"],
] }
language       = { equivalent_to = "language", label = "Language", clause = "language:{value}", modes = ["any", "none"], options = [
  ["en", "English"],
  ["es", "Spanish"],
  ["de", "German"],
  ["fr", "French"],
  ["pt", "Portuguese"],
  ["zh", "Chinese"],
  ["ja", "Japanese"],
  ["ru", "Russian"],
  ["it", "Italian"],
  ["ko", "Korean"],
  ["id", "Indonesian"],
  ["pl", "Polish"],
  ["tr", "Turkish"],
  ["nl", "Dutch"],
  ["uk", "Ukrainian"],
  ["ar", "Arabic"],
  ["cs", "Czech"],
  ["sv", "Swedish"],
  ["fa", "Persian"],
  ["ca", "Catalan"],
] }

open_access    = { equivalent_to = "open_access", label = "Open access only", group = "Access", clause = "open_access.is_oa:true" }
fulltext       = { label = "Full text available", group = "Access", clause = "has_fulltext:true" }
oa_status      = { label = "Open-access status", clause = "open_access.oa_status:{value}", modes = ["any", "none"], options = [["gold", "Gold"], ["diamond", "Diamond"], ["green", "Green"], ["hybrid", "Hybrid"], ["bronze", "Bronze"], ["closed", "Closed"]] }
license        = { label = "Licence", clause = "best_oa_location.license:{value}", modes = ["any", "none"], options = [["cc-by", "CC BY"], ["cc-by-sa", "CC BY-SA"], ["cc-by-nc", "CC BY-NC"], ["cc-by-nc-sa", "CC BY-NC-SA"], ["cc-by-nd", "CC BY-ND"], ["cc-by-nc-nd", "CC BY-NC-ND"], ["public-domain", "Public domain"], ["other-oa", "Other open licence"]] }

cited_min      = { equivalent_to = "cited_more_than", label = "More than", group = "Citations", clause = "cited_by_count:>{value}", value = "integer" }
cited_max      = { equivalent_to = "cited_fewer_than", label = "Fewer than", group = "Citations", clause = "cited_by_count:<{value}", value = "integer" }
impact_min     = { label = "Field-weighted impact above", clause = "fwci:>{value}", value = "number" }
top_10_percent = { label = "Top 10% cited in its field and year", group = "Standing", clause = "citation_normalized_percentile.is_in_top_10_percent:true" }
top_1_percent  = { label = "Top 1% cited in its field and year", group = "Standing", clause = "citation_normalized_percentile.is_in_top_1_percent:true" }

domain         = { label = "Domain", clause = "primary_topic.domain.id:{value}", modes = ["any", "none"], options = [["1", "Life Sciences"], ["2", "Social Sciences"], ["3", "Physical Sciences"], ["4", "Health Sciences"]] }
field          = { label = "Field", clause = "primary_topic.field.id:{value}", modes = ["any", "none"], options = [
  ["11", "Agricultural and Biological Sciences"],
  ["12", "Arts and Humanities"],
  ["13", "Biochemistry, Genetics and Molecular Biology"],
  ["14", "Business, Management and Accounting"],
  ["15", "Chemical Engineering"],
  ["16", "Chemistry"],
