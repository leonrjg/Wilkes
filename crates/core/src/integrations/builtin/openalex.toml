  ["24", "Immunology and Microbiology"],
  ["25", "Materials Science"],
  ["26", "Mathematics"],
  ["27", "Medicine"],
  ["28", "Neuroscience"],
  ["29", "Nursing"],
  ["30", "Pharmacology, Toxicology and Pharmaceutics"],
  ["31", "Physics and Astronomy"],
  ["32", "Psychology"],
  ["33", "Social Sciences"],
  ["34", "Veterinary"],
  ["35", "Dentistry"],
  ["36", "Health Professions"],
] }
topic          = { label = "Topic", clause = "topics.id:{value}", modes = ["any", "all", "none"], suggest = "/autocomplete/topics?q={query}" }
keyword        = { label = "Keyword", clause = "keywords.id:{value}", modes = ["any", "all", "none"], suggest = "/autocomplete/keywords?q={query}" }

author         = { equivalent_to = "author", label = "Author", clause = "authorships.author.id:{value}", modes = ["any", "all", "none"], suggest = "/autocomplete/authors?q={query}" }
institution    = { equivalent_to = "institution", label = "Institution", clause = "authorships.institutions.lineage:{value}", modes = ["any", "all", "none"], suggest = "/autocomplete/institutions?q={query}" }
institution_type = { label = "Institution type", clause = "authorships.institutions.type:{value}", modes = ["any", "none"], options = [["education", "Education"], ["healthcare", "Healthcare"], ["company", "Company"], ["government", "Government"], ["nonprofit", "Nonprofit"], ["facility", "Facility"], ["archive", "Archive"], ["other", "Other"]] }
continent      = { label = "Continent", clause = "authorships.institutions.continent:{value}", modes = ["any", "all", "none"], options = [["Q15", "Africa"], ["Q48", "Asia"], ["Q46", "Europe"], ["Q49", "North America"], ["Q55643", "Oceania"], ["Q18", "South America"]] }
country        = { equivalent_to = "country", label = "Country", clause = "authorships.countries:{value}", modes = ["any", "all", "none"], options = [
