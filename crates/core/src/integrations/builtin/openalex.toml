global_south   = { label = "From the Global South", clause = "authorships.institutions.is_global_south:true" }
authors_min    = { label = "More than", group = "Number of authors", clause = "authors_count:>{value}", value = "integer" }
authors_max    = { label = "Fewer than", group = "Number of authors", clause = "authors_count:<{value}", value = "integer" }
affiliation    = { label = "Affiliation mentions", clause = "raw_affiliation_strings.search:{value}", value = "text" }

journal        = { label = "Journal or source", clause = "primary_location.source.id:{value}", modes = ["any", "none"], suggest = "/autocomplete/sources?q={query}" }
publisher      = { label = "Publisher", clause = "primary_location.source.host_organization_lineage:{value}", modes = ["any", "none"], suggest = "/autocomplete/publishers?q={query}" }
source_type    = { label = "Published in a", clause = "primary_location.source.type:{value}", modes = ["any", "none"], options = [["journal", "Journal"], ["repository", "Repository"], ["conference", "Conference"]] }
in_doaj        = { label = "In an open-access journal directory (DOAJ)", clause = "primary_location.source.is_in_doaj:true" }
indexed_in     = { label = "Indexed in", clause = "indexed_in:{value}", modes = ["any", "all", "none"], options = [["crossref", "Crossref"], ["pubmed", "PubMed"], ["arxiv", "arXiv"], ["doaj", "DOAJ"], ["datacite", "DataCite"]] }
funder         = { label = "Funder", clause = "funders.id:{value}", modes = ["any", "all", "none"], suggest = "/autocomplete/funders?q={query}" }

title          = { label = "Title mentions", clause = "title.search:{value}", value = "text" }
abstract       = { label = "Abstract mentions", clause = "abstract.search:{value}", value = "text" }
full_text      = { label = "Full text mentions", clause = "fulltext.search:{value}", value = "text" }

has_abstract   = { label = "Has an abstract", group = "Record", clause = "has_abstract:true" }
has_doi        = { label = "Has a DOI", group = "Record", clause = "has_doi:true" }
has_references = { label = "Lists its references", group = "Record", clause = "has_references:true" }
not_retracted  = { label = "Hide retracted works", group = "Record", clause = "is_retracted:false" }
not_paratext   = { label = "Hide covers, indexes and front matter", group = "Record", clause = "is_paratext:false" }

cites          = { label = "Works citing", clause = "cites:{value}", from_result = "id", suggest = "/autocomplete/works?q={query}" }
cited_by       = { label = "Works cited by", clause = "cited_by:{value}", from_result = "id", suggest = "/autocomplete/works?q={query}" }
related_to     = { label = "Works related to", clause = "related_to:{value}", from_result = "id", suggest = "/autocomplete/works?q={query}" }

# ── Lookup: DOI in, one record out (metadata enrichment) ──────────────────────

# Tried in order: the DOI index first, then the landing-page index, which knows
# works whose DOI the first does not.
[capabilities.lookup]
paths = [
  "/works?filter=doi:https://doi.org/{doi}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location&per-page=1",
  "/works?filter=locations.landing_page_url:https://doi.org/{doi}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location&per-page=1",
]
record = "results[0]"

[capabilities.lookup.fields]
id = "id"
title = "display_name"
year = "publication_year"
publication_date = "publication_date"
venue = "primary_location.source.display_name"
citation_count = "cited_by_count"
external_ids = "ids"

# ── References: DOI in, the DOIs the work cites out (citation graph) ──────────

[capabilities.references]
path = "/works?filter=doi:https://doi.org/{doi}&select=id,referenced_works&per-page=1"
# OpenAlex ids, short form (`W123…`), of the works this one references.
ids = "map(&split(@, '/')[-1], results[0].referenced_works || `[]`)"

# OpenAlex accepts up to 50 OR-values per filter; one request resolves a chunk
# back to DOIs. A reference without a DOI is not an edge a DOI-keyed library
# can join, so it is left out.
[capabilities.references.resolve]
path = "/works?filter=openalex_id:{ids}&select=id,doi&per-page={count}"
join = "|"
chunk = 50
items = "results"
doi = "doi"
