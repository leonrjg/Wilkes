# OpenAlex (https://openalex.org): the open catalogue of scholarly works.
#
# Shipped with Wilkes as a manifest and loaded through the same engine as any
# manifest a user writes. Nothing about it is compiled in.

manifest_version = 2
id = "openalex"
name = "OpenAlex"

[http]
base_url = "https://api.openalex.org"

# OpenAlex answers anonymous requests from a shared pool and requests that
# identify a contact address from a faster one. Optional: the integration works
# without it.
[http.query]
mailto = { secret = "email", optional = true, label = "Email", kind = "email" }

[capabilities.health]
path = "/works?filter=doi:https://doi.org/10.1145/3801158&select=id&per-page=1"

# ── Search: keyword in, works out ─────────────────────────────────────────────

[capabilities.search]
path = "/works?search={query}&per-page={limit}&page={page}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location,best_oa_location,open_access,authorships"
items = "results"

[capabilities.search.fields]
id = "id"
title = "display_name"
doi = "normalize_doi(ids.doi)"
year = "publication_year"
publication_date = "publication_date"
venue = "primary_location.source.display_name"
citation_count = "cited_by_count"
# A work is open access when either the work or its best location says so.
is_open_access = "open_access.is_oa || best_oa_location.is_oa"
pdf_url = "best_oa_location.pdf_url"
landing_page_url = "not_null(best_oa_location.landing_page_url, open_access.oa_url)"
open_access_status = "open_access.oa_status"
license = "best_oa_location.license"
publisher = "primary_location.source.host_organization_name"
# The first few authors; an empty list is no authors, not an empty string.
authors = "join(', ', authorships[:8].author.display_name || `[]`) || `null`"

# ── Browse: the same works, listed by filter and sort ─────────────────────────

[capabilities.browse]
path = "/works?per-page={limit}&page={page}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location,best_oa_location,open_access,authorships"
query_param = "search"
filter_param = "filter"
filter_separator = ","

[capabilities.browse.sort]
param = "sort"
default = "cited_by_count:desc"
keyword_default = "relevance_score:desc"
options = [
  ["cited_by_count:desc", "Most cited"],
  ["publication_date:desc", "Newest first"],
  ["publication_date:asc", "Oldest first"],
  ["relevance_score:desc", "Most relevant (needs a keyword)"],
]

[capabilities.browse.filters.year]
kind = "range"
label = "Year"
min_clause = "from_publication_date:{value}-01-01"
max_clause = "to_publication_date:{value}-12-31"

[capabilities.browse.filters.cited_by]
kind = "range"
label = "Cited more than"
min_clause = "cited_by_count:>{value}"

[capabilities.browse.filters.domain]
kind = "choice"
label = "Domain"
clause = "primary_topic.domain.id:{value}"
options = [
  ["1", "Life Sciences"],
  ["2", "Social Sciences"],
  ["3", "Physical Sciences"],
  ["4", "Health Sciences"],
]

[capabilities.browse.filters.field]
kind = "choice"
label = "Field"
clause = "primary_topic.field.id:{value}"
options = [
  ["11", "Agricultural and Biological Sciences"],
  ["12", "Arts and Humanities"],
  ["13", "Biochemistry, Genetics and Molecular Biology"],
  ["14", "Business, Management and Accounting"],
  ["15", "Chemical Engineering"],
  ["16", "Chemistry"],
  ["17", "Computer Science"],
  ["18", "Decision Sciences"],
  ["19", "Earth and Planetary Sciences"],
  ["20", "Economics, Econometrics and Finance"],
  ["21", "Energy"],
  ["22", "Engineering"],
  ["23", "Environmental Science"],
  ["24", "Immunology and Microbiology"],
  ["25", "Materials Science"],
  ["26", "Mathematics"],
  ["27", "Medicine"],
  ["28", "Neuroscience"],
  ["29", "Nursing"],
  ["30", "Pharmacology, Toxicology and Pharmaceutics"],
  ["31", "Physics and Astronomy"],
  ["32", "Psychology"],
  ["33", "Social Sciences"],
  ["34", "Veterinary"],
  ["35", "Dentistry"],
  ["36", "Health Professions"],
]

[capabilities.browse.filters.type]
kind = "choice"
label = "Type"
clause = "type:{value}"
options = [
  ["article", "Article"],
  ["review", "Review"],
  ["preprint", "Preprint"],
  ["book", "Book"],
  ["book-chapter", "Book chapter"],
  ["dissertation", "Dissertation"],
  ["conference-paper", "Conference paper"],
  ["report", "Report"],
  ["dataset", "Dataset"],
  ["editorial", "Editorial"],
]

[capabilities.browse.filters.open_access]
kind = "flag"
label = "Open access only"
clause = "open_access.is_oa:true"

[capabilities.browse.filters.fulltext]
kind = "flag"
label = "Full text available"
clause = "has_fulltext:true"

[capabilities.browse.filters.not_retracted]
kind = "flag"
label = "Hide retracted works"
clause = "is_retracted:false"

# ── Lookup: DOI in, one record out (metadata enrichment) ──────────────────────

# Tried in order: the DOI index first, then the landing-page index, which knows
# works whose DOI the first does not.
[capabilities.lookup]
paths = [
  "/works?filter=doi:https://doi.org/{doi}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location&per-page=1",
  "/works?filter=locations.landing_page_url:https://doi.org/{doi}&select=id,doi,display_name,publication_year,publication_date,cited_by_count,ids,primary_location&per-page=1",
]
record = "results[0]"

[capabilities.lookup.fields]
id = "id"
title = "display_name"
year = "publication_year"
publication_date = "publication_date"
venue = "primary_location.source.display_name"
citation_count = "cited_by_count"
external_ids = "ids"

# ── References: DOI in, the DOIs the work cites out (citation graph) ──────────

[capabilities.references]
path = "/works?filter=doi:https://doi.org/{doi}&select=id,referenced_works&per-page=1"
# OpenAlex ids, short form (`W123…`), of the works this one references.
ids = "map(&split(@, '/')[-1], results[0].referenced_works || `[]`)"

# OpenAlex accepts up to 50 OR-values per filter; one request resolves a chunk
# back to DOIs. A reference without a DOI is not an edge a DOI-keyed library
# can join, so it is left out.
[capabilities.references.resolve]
path = "/works?filter=openalex_id:{ids}&select=id,doi&per-page={count}"
join = "|"
chunk = 50
items = "results"
doi = "doi"
