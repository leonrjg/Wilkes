[package]
name = "wilkes-core"
version.workspace = true
edition = "2021"

[features]
default = ["fastembed", "candle", "generate", "recognize-onnx"]
test-utils = []
fastembed = ["dep:fastembed", "dep:hf-hub", "dep:ureq", "dep:ort"]
fastembed-coreml = ["fastembed", "ort/coreml"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:ureq"]
# Recognition over ONNX Runtime. The default recognizer lives here, so this is
# in `default` while `candle` stays in it for the alternative one; a build with
# neither compiles and reports an empty recognizer catalogue.
recognize-onnx = ["dep:ort", "dep:tokenizers", "dep:hf-hub", "dep:ureq"]
# Recognition through Apple's Vision framework. No dependencies and no weights
# — the recognizer is the operating system's — so this costs a build.rs
# invocation and nothing else. Out of `default` on purpose: it reads prose only,
# and a build that shipped it as the default would quietly stop reading
# formulas and tables. The feature is not gated on the platform here because
# Cargo features are additive across a workspace; `build.rs` and the module
# gates decide whether anything is actually compiled.
recognize-vision = []
candle-metal = ["candle", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# CPU BLAS. Opt-in and deliberately NOT implied by candle-metal: candle's
# accelerate CPU backend bails on f16 matmul, which breaks quantized generation
# on the CPU fallback path. See docs/internal/specs/generation-engine.md §2.3.
candle-accelerate = ["candle", "candle-core/accelerate"]
generate = ["candle", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

# The smoke test exercises the Vision shim through the FFI boundary, so it
# only exists when that shim is compiled. Declared rather than left to fail:
# `--all-targets` on a default build would otherwise not compile.
[[example]]
name = "vision_smoke"
required-features = ["recognize-vision"]

[build-dependencies]
cc = "1"

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
infer = "0.16"
mupdf = "0.6"
# Pixel buffers and resampling for native image enrichment. Not an inference
# dependency: no runtime, no models, and already in the tree transitively.
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
rayon = "1"
dirs = "5"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
text-splitter = { version = "0.27", features = ["markdown"] }
async-trait = "0.1"
libc = "0.2"
sqlite-vec = "0.1.9"
strip-ansi-escapes = "0.2.1"
which = "6"
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2"
url = "2"
base64 = "0.22"
tempfile = "3.10"
uuid = { version = "1", features = ["v4"] }

[dependencies.ort]
# Exact, because fastembed pins ort exactly and two ort versions in one
# process is two ONNX Runtimes. Moved rc.11 -> rc.13 with fastembed 5.17:
# rc.12 relocated `ort::tensor` into `ort::value`, so recognition is written
# against rc.13's paths rather than against paths that were about to move.
version = "=2.0.0-rc.13"
optional = true

[dependencies.fastembed]
version = "5"
optional = true

[dependencies.hf-hub]
version = "0.4"
optional = true

[dependencies.ureq]
version = "2"
optional = true

[dependencies.candle-core]
version = "0.11"
optional = true

[dependencies.candle-nn]
version = "0.11"
optional = true

[dependencies.candle-transformers]
version = "0.11"
optional = true

[dependencies.tokenizers]
version = "0.20"
optional = true

[dependencies.sha2]
version = "0.10"

[target.'cfg(target_os = "macos")'.dependencies.candle-core]
version = "0.11"
optional = true
features = ["metal"]

[target.'cfg(target_os = "macos")'.dependencies.candle-nn]
version = "0.11"
optional = true
features = ["metal"]

[target.'cfg(target_os = "macos")'.dependencies.candle-transformers]
version = "0.11"
optional = true
features = ["metal"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.10"
mockall = "0.13"
mockito = "1.4"
base64 = "0.22.1"
wilkes-core = { path = ".", features = ["test-utils"] }

[[example]]
name = "inline_probe"
required-features = ["recognize-onnx"]

[[example]]
name = "formula_probe"
required-features = ["recognize-onnx"]

[[example]]
name = "read_probe"
required-features = ["recognize-onnx"]

[[example]]
name = "page_probe"
required-features = ["recognize-onnx"]
