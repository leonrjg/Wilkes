[package]
name = "wilkes-server"
version.workspace = true
edition = "2021"

[lib]
name = "wilkes_server"
path = "src/lib.rs"

[[bin]]
name = "wilkes-server"
path = "src/main.rs"

[features]
# Declared but not default: this crate asks for `wilkes-core` without
# `recognize-onnx`, so its install routes answer with an explanation rather
# than a 404. Declaring it is what makes that a decision instead of a cfg that
# silently reads `false`.
recognize-onnx = ["wilkes-api/recognize-onnx", "wilkes-core/recognize-onnx"]

[dependencies]
wilkes-api = { path = "../api" }
wilkes-core = { path = "../core", default-features = false, features = ["fastembed", "candle", "generate"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
wilkes-core = { path = "../core", features = ["test-utils"] }
